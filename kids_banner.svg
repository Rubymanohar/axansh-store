<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdcb6e" />
      <stop offset="100%" stop-color="#e17055" />
    </linearGradient>
    <filter id="shadowKids" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="2100" height="900" fill="url(#bgKids)" />
  
  <circle cx="1800" cy="200" r="100" fill="#ffffff" opacity="0.2" />
  <polygon points="300,600 400,800 200,800" fill="#ffffff" opacity="0.2" />
  <rect x="1800" y="700" width="100" height="100" rx="20" fill="#ffffff" opacity="0.2" transform="rotate(15 1850 750)"/>

  <rect x="700" y="200" width="700" height="80" rx="40" fill="#ffffff" filter="url(#shadowKids)" />
  <text x="1050" y="255" font-family="'Inter', system-ui, sans-serif" font-size="35" font-weight="800" fill="#e17055" text-anchor="middle" letter-spacing="4">KIDS' FASHION &amp; TOYS</text>

  <text x="1050" y="500" font-family="'Inter', system-ui, sans-serif" font-size="180" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadowKids)" letter-spacing="-3">STARTING AT ₹99</text>
  
  <text x="1050" y="660" font-family="'Inter', system-ui, sans-serif" font-size="65" font-weight="800" fill="#6c5ce7" text-anchor="middle" letter-spacing="4">CLOTHING • TOYS • ACCESSORIES</text>
  
  <text x="1050" y="780" font-family="'Inter', system-ui, sans-serif" font-size="40" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">Biggest Range For Little Ones</text>
</svg>
