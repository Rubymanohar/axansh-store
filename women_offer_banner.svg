<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWomen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb3" />
      <stop offset="100%" stop-color="#ff758c" />
    </linearGradient>
    <filter id="shadowWomen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="2100" height="900" fill="url(#bgWomen)" />
  
  <!-- Elegant overlapping shapes -->
  <circle cx="1900" cy="150" r="300" fill="#ffffff" opacity="0.15" />
  <circle cx="1700" cy="0" r="200" fill="#ffffff" opacity="0.1" />
  <circle cx="200" cy="800" r="400" fill="#ffffff" opacity="0.15" />
  <circle cx="400" cy="950" r="250" fill="#ffffff" opacity="0.1" />

  <!-- Subheading -->
  <rect x="700" y="200" width="700" height="80" rx="40" fill="#ffffff" filter="url(#shadowWomen)" />
  <text x="1050" y="255" font-family="'Inter', system-ui, sans-serif" font-size="35" font-weight="800" fill="#ff758c" text-anchor="middle" letter-spacing="4">WOMEN'S EXCLUSIVE OFFER</text>

  <!-- Main Text -->
  <text x="1050" y="500" font-family="'Inter', system-ui, sans-serif" font-size="200" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadowWomen)" letter-spacing="-3">FLAT 60% OFF</text>
  
  <text x="1050" y="660" font-family="'Inter', system-ui, sans-serif" font-size="65" font-weight="800" fill="#ffeaa7" text-anchor="middle" letter-spacing="6">SAREES • KURTIS • DRESSES</text>
  
  <!-- Badge -->
  <text x="1050" y="780" font-family="'Inter', system-ui, sans-serif" font-size="40" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">Shop The New Trending Collection</text>
</svg>
