<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0984e3" />
      <stop offset="100%" stop-color="#00cec9" />
    </linearGradient>
    <filter id="shadowMen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="2100" height="900" fill="url(#bgMen)" />
  
  <rect x="1800" y="100" width="200" height="200" fill="#ffffff" opacity="0.1" transform="rotate(45 1900 200)"/>
  <rect x="100" y="600" width="300" height="300" fill="#ffffff" opacity="0.1" transform="rotate(25 250 750)"/>

  <rect x="700" y="200" width="700" height="80" rx="40" fill="#ffffff" filter="url(#shadowMen)" />
  <text x="1050" y="255" font-family="'Inter', system-ui, sans-serif" font-size="35" font-weight="800" fill="#0984e3" text-anchor="middle" letter-spacing="4">MEN'S FASHION</text>

  <text x="1050" y="500" font-family="'Inter', system-ui, sans-serif" font-size="180" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadowMen)" letter-spacing="-3">UP TO 50% OFF</text>
  
  <text x="1050" y="660" font-family="'Inter', system-ui, sans-serif" font-size="65" font-weight="800" fill="#ffeaa7" text-anchor="middle" letter-spacing="4">SHIRTS • T-SHIRTS • JEANS</text>
  
  <text x="1050" y="780" font-family="'Inter', system-ui, sans-serif" font-size="40" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">Upgrade Your Daily Wardrobe</text>
</svg>
